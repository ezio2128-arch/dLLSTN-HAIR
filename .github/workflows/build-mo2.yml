name: Build TN Character Rebuild CS183 Addon v0.6 MO2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify inputs
        shell: bash
        run: |
          set -e
          for f in \
            meta.ini \
            fomod/ModuleConfig.xml \
            fomod/info.xml \
            Documentation/README.txt \
            Core/Shaders/Hair/TangentShift.dds \
            Presets/Balanced/Shaders/Hair/Hair.hlsli \
            Presets/Cinematic/Shaders/Hair/Hair.hlsli \
            Presets/Extreme/Shaders/Hair/Hair.hlsli
          do
            [ -f "$f" ] || { echo "Missing $f"; exit 1; }
          done

      - name: Prepare MO2 package
        shell: bash
        run: |
          set -e
          PKG="out/TN-Character-Rebuild-CS183-Addon-v0.6-MO2"
          mkdir -p "$PKG"
          cp meta.ini "$PKG/"
          mkdir -p "$PKG/Core/Shaders/Hair" "$PKG/Presets/Balanced/Shaders/Hair" "$PKG/Presets/Cinematic/Shaders/Hair" "$PKG/Presets/Extreme/Shaders/Hair" "$PKG/Documentation" "$PKG/fomod"
          cp Core/Shaders/Hair/TangentShift.dds "$PKG/Core/Shaders/Hair/"
          cp Presets/Balanced/Shaders/Hair/Hair.hlsli "$PKG/Presets/Balanced/Shaders/Hair/"
          cp Presets/Cinematic/Shaders/Hair/Hair.hlsli "$PKG/Presets/Cinematic/Shaders/Hair/"
          cp Presets/Extreme/Shaders/Hair/Hair.hlsli "$PKG/Presets/Extreme/Shaders/Hair/"
          cp Documentation/README.txt "$PKG/Documentation/"
          cp fomod/ModuleConfig.xml "$PKG/fomod/"
          cp fomod/info.xml "$PKG/fomod/"
          (cd out && zip -r "TN-Character-Rebuild-CS183-Addon-v0.6-MO2.zip" "TN-Character-Rebuild-CS183-Addon-v0.6-MO2")
          sha256sum out/TN-Character-Rebuild-CS183-Addon-v0.6-MO2.zip

      - name: Upload MO2 installer
        uses: actions/upload-artifact@v4
        with:
          name: TN-Character-Rebuild-CS183-Addon-v0.6-MO2
          path: out/TN-Character-Rebuild-CS183-Addon-v0.6-MO2.zip
          if-no-files-found: error
          retention-days: 30
