name: Build TN Character Rebuild 0.5.1 MO2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout TN overlay
        uses: actions/checkout@v6

      - name: Checkout Community Shaders 1.8.3
        uses: actions/checkout@v6
        with:
          repository: community-shaders/skyrim-community-shaders
          ref: v1.8.3
          path: cs
          submodules: recursive
          fetch-depth: 1

      - name: Verify inputs
        shell: pwsh
        run: |
          $cmake = Get-Content cs/CMakeLists.txt -Raw
          if ($cmake -notmatch '(?s)project\s*\(.*?CommunityShaders.*?VERSION\s+1\.8\.3') { throw 'Not Community Shaders 1.8.3.' }
          foreach ($file in @(
            'overlay/src/Features/HairSpecular.cpp',
            'overlay/package/Shaders/Common/SharedData.hlsli',
            'overlay/features/Hair Specular/Shaders/Hair/Hair.hlsli'
          )) { if (-not (Test-Path $file)) { throw "Missing $file" } }

      - name: Apply integrated overlay
        shell: pwsh
        run: |
          Get-ChildItem overlay -File -Recurse | Where-Object { $_.FullName -notmatch '\\tests\\' } | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path overlay), $_.FullName)
            $dest = Join-Path (Resolve-Path cs) $relative
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dest) | Out-Null
            Copy-Item $_.FullName $dest -Force
          }

      - name: Install CMake 4.2
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: "~4.2.0"
          useCloudCache: false

      - name: Install Visual Studio Build Tools
        shell: pwsh
        run: |
          $u='https://aka.ms/vs/stable/vs_BuildTools.exe'; $p="$env:TEMP\vs_buildtools.exe"
          Invoke-WebRequest -Uri $u -OutFile $p -UseBasicParsing
          $proc=Start-Process -FilePath $p -ArgumentList '--quiet','--wait','--norestart','--nocache','--add','Microsoft.VisualStudio.Workload.VCTools','--add','Microsoft.VisualStudio.Component.VC.Tools.x86.x64','--add','Microsoft.VisualStudio.Component.Windows11SDK.26100' -Wait -NoNewWindow -PassThru
          if (@(0,3010) -notcontains $proc.ExitCode) { throw "VS Build Tools failed: $($proc.ExitCode)" }

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgJsonGlob: cs/vcpkg.json

      - name: Configure
        shell: pwsh
        working-directory: cs
        run: cmake -S . --preset ALL

      - name: Build Release DLL
        shell: pwsh
        working-directory: cs
        run: cmake --build --preset ALL --target CommunityShaders

      - name: Prepare MO2 package
        shell: pwsh
        run: |
          $dll=Get-ChildItem cs/build -Filter CommunityShaders.dll -File -Recurse | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $dll) { throw 'CommunityShaders.dll was not produced.' }
          $pkg=Join-Path $PWD 'out/TN-Character-Rebuild-051-CS183-MO2'
          $plugin=Join-Path $pkg 'SKSE/Plugins'
          $tr=Join-Path $plugin 'CommunityShaders/Translations'
          $common=Join-Path $pkg 'Shaders/Common'
          $hair=Join-Path $pkg 'Shaders/Hair'
          $doc=Join-Path $pkg 'Documentation/TN Character Rebuild 0.5.1'
          New-Item -ItemType Directory -Force -Path $tr,$common,$hair,$doc | Out-Null
          Copy-Item $dll.FullName (Join-Path $plugin 'CommunityShaders.dll') -Force
          Copy-Item overlay/package/SKSE/Plugins/CommunityShaders/Translations/en.json $tr -Force
          Copy-Item overlay/package/SKSE/Plugins/CommunityShaders/Translations/es.json $tr -Force
          Copy-Item overlay/package/Shaders/Common/SharedData.hlsli $common -Force
          Copy-Item 'overlay/features/Hair Specular/Shaders/Hair/Hair.hlsli' $hair -Force
          Copy-Item 'overlay/features/Hair Specular/Shaders/Hair/TangentShift.dds' $hair -Force
          Copy-Item README.md,COPYING,MANIFEST.json $doc -Force
          @'
          [General]
          gameName=Skyrim Special Edition
          modid=0
          version=0.5.1
          newestVersion=0.5.1
          installationFile=TN-Character-Rebuild-051-CS183-MO2.zip
          notes=TN Character Rebuild 0.5.1 without TN Adaptive 80. Hair Specular TN controls only.
          '@ | Set-Content (Join-Path $pkg 'meta.ini') -Encoding UTF8
          Compress-Archive -Path "$pkg/*" -DestinationPath 'out/TN-Character-Rebuild-051-CS183-MO2.zip' -Force
          Get-FileHash 'out/TN-Character-Rebuild-051-CS183-MO2.zip' -Algorithm SHA256 | Format-List

      - name: Upload MO2 installer
        uses: actions/upload-artifact@v7
        with:
          name: TN-Character-Rebuild-051-CS183-MO2
          path: out/TN-Character-Rebuild-051-CS183-MO2.zip
          if-no-files-found: error
          retention-days: 30
